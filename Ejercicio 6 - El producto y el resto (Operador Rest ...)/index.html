<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 6 — El producto y el resto (Operador Rest)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-900 to-orange-800 flex items-center justify-center p-6 pt-16">
  <nav class="fixed inset-x-0 top-0 z-50 border-b border-slate-200 bg-white/95 px-4 py-3 shadow-sm backdrop-blur">
    <a href="../index.html" class="inline-flex min-h-[44px] items-center text-sm font-semibold text-blue-600">← Volver al dashboard</a>
  </nav>

  <main class="w-full max-w-md">

    <header class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white drop-shadow-md">Ejercicio 6</h1>
      <p class="mt-1 text-white/70 text-sm">El producto y el resto (Operador Rest)</p>
    </header>

    <article class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="bg-amber-600 px-6 py-4">
        <p class="text-amber-200 text-sm">Producto</p>
        <h2 class="text-xl font-bold text-white mt-1" id="nombre">—</h2>
        <p class="text-amber-100 text-xs mt-1 font-mono" id="id">—</p>
      </div>

      <div class="px-6 py-5 space-y-4">
        <div>
          <p class="text-sm text-slate-400">Precio</p>
          <p class="text-2xl font-bold text-slate-800" id="precio">—</p>
        </div>

        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-100">
          <div>
            <p class="text-sm text-slate-400">Marca</p>
            <p class="font-semibold text-slate-800" id="marca">—</p>
          </div>
          <div>
            <p class="text-sm text-slate-400">Stock</p>
            <p class="font-semibold text-slate-800" id="stock">—</p>
          </div>
        </div>
      </div>
    </article>

    <section class="mt-5 bg-white/10 backdrop-blur-sm border border-white/20 rounded-xl p-4 text-center">
      <p class="text-sm text-white/80">
        Abre la consola
        <kbd class="mx-1 px-2 py-0.5 rounded bg-white/15 text-white text-xs font-mono">F12</kbd>
        para ver el resultado:
      </p>
      <p class="mt-2 font-mono text-amber-200 text-sm">PROD-10 29.99</p>
      <p class="mt-1 font-mono text-amber-200/80 text-xs">
        { nombre: 'Teclado Mecánico', marca: 'Logitech', stock: 15 }
      </p>
    </section>

    <footer class="text-center mt-5">
      <a
        href="guia.html"
        class="text-amber-200 hover:text-white hover:underline transition text-sm"
      >
        Ver la guía explicativa
      </a>
    </footer>

  </main>

  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El podio de una carrera — Ejercicio 2</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-6 pt-16 bg-[url('img/bg.webp')] bg-cover bg-center bg-no-repeat bg-fixed">
  <nav class="fixed inset-x-0 top-0 z-50 border-b border-slate-200 bg-white/95 px-4 py-3 shadow-sm backdrop-blur">
    <a href="../index.html" class="inline-flex min-h-[44px] items-center text-sm font-semibold text-blue-600">← Volver al dashboard</a>
  </nav>

  <main class="w-full max-w-lg">
    <h1 class="text-center text-2xl font-bold text-white mb-6 drop-shadow-md">
      El podio de la carrera
    </h1>

    <div class="grid gap-4">

      <article class="bg-amber-50 border-2 border-amber-400 rounded-2xl p-5 shadow">
        <p class="text-sm font-semibold text-amber-600">🥇 Oro</p>
        <p class="text-xl font-bold text-slate-800" id="oro">—</p>
      </article>

      <article class="bg-slate-50 border-2 border-slate-300 rounded-2xl p-5 shadow">
        <p class="text-sm font-semibold text-slate-500">🥈 Plata</p>
        <p class="text-xl font-bold text-slate-800" id="plata">—</p>
      </article>

      <article class="bg-orange-50 border-2 border-orange-300 rounded-2xl p-5 shadow">
        <p class="text-sm font-semibold text-orange-600">🥉 Bronce</p>
        <p class="text-xl font-bold text-slate-800" id="bronce">—</p>
      </article>

    </div>

    <p class="text-center text-sm text-white/80 mt-4 drop-shadow">
      Abre la consola (F12) para ver el resultado del ejercicio
    </p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>

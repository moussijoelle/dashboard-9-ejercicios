<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 5 — Datos anidados de un e-commerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-900 to-teal-800 flex items-center justify-center p-6 pt-16">
  <nav class="fixed inset-x-0 top-0 z-50 border-b border-slate-200 bg-white/95 px-4 py-3 shadow-sm backdrop-blur">
    <a href="../index.html" class="inline-flex min-h-[44px] items-center text-sm font-semibold text-blue-600">← Volver al dashboard</a>
  </nav>

  <main class="w-full max-w-md">

    <header class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white drop-shadow-md">Ejercicio 5</h1>
      <p class="mt-1 text-white/70 text-sm">Datos anidados de un e-commerce</p>
    </header>

    <article class="bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="bg-emerald-600 px-6 py-4">
        <p class="text-emerald-200 text-sm">Cliente</p>
        <h2 class="text-xl font-bold text-white mt-1" id="nombre">—</h2>
        <p class="text-emerald-100 text-xs mt-1 font-mono" id="id-cliente">—</p>
      </div>

      <div class="px-6 py-5 space-y-4">
        <div>
          <p class="text-sm text-slate-400">Ciudad</p>
          <p class="text-lg font-semibold text-slate-800" id="ciudad">—</p>
        </div>

        <div>
          <p class="text-sm text-slate-400">País</p>
          <p class="text-lg font-semibold text-slate-800" id="pais">—</p>
        </div>
      </div>
    </article>

    <section class="mt-5 bg-white/10 backdrop-blur-sm border border-white/20 rounded-xl p-4 text-center">
      <p class="text-sm text-white/80">
        Abre la consola
        <kbd class="mx-1 px-2 py-0.5 rounded bg-white/15 text-white text-xs font-mono">F12</kbd>
        para ver el resultado:
      </p>
      <p class="mt-2 font-mono text-emerald-200 text-sm">Laura Barcelona España</p>
    </section>

    <footer class="text-center mt-5">
      <a
        href="guia.html"
        class="text-emerald-200 hover:text-white hover:underline transition text-sm"
      >
        Ver la guía explicativa
      </a>
    </footer>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
